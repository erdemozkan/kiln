<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiln bench</title>
    <script vite-ignore src="./coi.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>Kiln bench</h1>
      <p class="sub">GPU time per step and per kernel, plus end-to-end decode speed. <a href="./">Playground</a> · <a href="kernels.html">Kernel check</a></p>
      <div class="row">
        <input id="model" type="text" value="HuggingFaceTB/SmolLM2-135M-Instruct" aria-label="Model id" />
        <select id="quant" aria-label="Weight format">
          <option value="q4">q4</option>
          <option value="q8">q8</option>
          <option value="f32">f32</option>
        </select>
        <button id="run">Run</button>
      </div>
      <div id="out"></div>
    </main>
    <script type="module" src="./src/bench.ts"></script>
  </body>
</html>
