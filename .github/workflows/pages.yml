name: Deploy demo

# Started by hand only (Actions → Deploy demo → Run workflow), so pushes never publish anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site (docs, examples, migration guide, benchmarks) at the root, the playground under it.
      - run: npm run build:site
      - run: npm run build:playground
      - run: cp -R examples/playground/dist site/dist/playground
      # The library itself (one file, its worker inside), importable from any site as …/kiln/kiln-webgpu.js.
      - run: cp packages/kiln-webgpu/dist/index.js site/dist/kiln-webgpu.js
      # Every released version beside it (…/kiln/0.2.0/kiln-webgpu.js), fetched from npm and checksum-checked.
      - run: node scripts/pages-versions.mjs site/dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
