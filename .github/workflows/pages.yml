name: Deploy demo

# Started by hand only (Actions → Deploy demo → Run workflow), so pushes never publish anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site (docs, examples, migration guide, benchmarks) at the root, the playground under it.
      - run: npm run build:site
      - run: npm run build:playground
      - run: cp -R examples/playground/dist site/dist/playground
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
